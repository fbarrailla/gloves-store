<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STK Admin — Activity</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar"></aside>

    <main class="main">
      <header class="main__head">
        <div>
          <h1>Activity</h1>
          <p>Add-to-bag events across the storefront.</p>
        </div>
      </header>

      <section class="stats" id="stats">
        <div class="stat"><div class="stat__label">Events (24h)</div><div class="stat__value"><span class="spinner"></span></div></div>
        <div class="stat"><div class="stat__label">Events (7d)</div><div class="stat__value"><span class="spinner"></span></div></div>
        <div class="stat"><div class="stat__label">Top SKU (7d)</div><div class="stat__value"><span class="spinner"></span></div></div>
        <div class="stat"><div class="stat__label">All-time</div><div class="stat__value"><span class="spinner"></span></div></div>
      </section>

      <section class="panel">
        <div class="panel__head">
          <h2>Latest 200 events</h2>
          <span class="count" id="countLine"></span>
        </div>
        <div id="tableHost"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { supabase, requireAuth, renderShell, refreshCounts, fmtDate, escape } from './admin.js';

    const session = await requireAuth();
    renderShell({ current: 'activity', session });
    refreshCounts();

    const tableHost = document.getElementById('tableHost');
    const countLine = document.getElementById('countLine');
    const stats = document.getElementById('stats');

    const now = new Date();
    const d24 = new Date(now - 24 * 60 * 60 * 1000).toISOString();
    const d7  = new Date(now -  7 * 24 * 60 * 60 * 1000).toISOString();

    const [c24, c7, cAll, recent7] = await Promise.all([
      supabase.from('bag_events').select('id', { count: 'exact', head: true }).gte('created_at', d24),
      supabase.from('bag_events').select('id', { count: 'exact', head: true }).gte('created_at', d7),
      supabase.from('bag_events').select('id', { count: 'exact', head: true }),
      supabase.from('bag_events').select('sku').gte('created_at', d7).limit(500),
    ]);

    // Top SKU in last 7d
    const counts = {};
    (recent7.data ?? []).forEach(r => { if (r.sku) counts[r.sku] = (counts[r.sku] ?? 0) + 1; });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];

    stats.innerHTML = `
      <div class="stat"><div class="stat__label">Events (24h)</div><div class="stat__value">${c24.count ?? 0}</div></div>
      <div class="stat"><div class="stat__label">Events (7d)</div><div class="stat__value">${c7.count ?? 0}</div></div>
      <div class="stat"><div class="stat__label">Top SKU (7d)</div><div class="stat__value">${top ? escape(top[0]) : '—'}<div class="stat__delta">${top ? top[1] + ' adds' : 'no data'}</div></div></div>
      <div class="stat"><div class="stat__label">All-time</div><div class="stat__value">${cAll.count ?? 0}</div></div>
    `;

    const { data, error } = await supabase
      .from('bag_events')
      .select('id, sku, path, created_at')
      .order('created_at', { ascending: false })
      .limit(200);

    if (error) { tableHost.innerHTML = `<div class="empty"><strong>${escape(error.message)}</strong></div>`; }
    else if (!data || data.length === 0) {
      tableHost.innerHTML = `<div class="empty"><strong>No bag events yet</strong>Clicks on Add-to-bag across the storefront land here.</div>`;
    } else {
      countLine.textContent = `${data.length} shown`;
      tableHost.innerHTML = `
        <table>
          <thead><tr><th>SKU</th><th>Page</th><th class="right">When</th></tr></thead>
          <tbody>
            ${data.map(e => `
              <tr>
                <td><span class="id-pill">${escape(e.sku ?? '—')}</span></td>
                <td class="mono">${escape(e.path ?? '/')}</td>
                <td class="right mono">${fmtDate(e.created_at)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }
  </script>
</body>
</html>
